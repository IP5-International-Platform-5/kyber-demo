upstream kyber_php {
    server php:9000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 2m;

    # Same as .htaccess: /app/foo -> app/foo.php (user app backend)
    location ~ ^/app/(?<endpoint>[^/]+)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/app/$endpoint.php;
        fastcgi_param SCRIPT_NAME /app/$endpoint.php;
        fastcgi_pass kyber_php;
    }

    location ~ ^/api_server/(?<endpoint>[^/]+)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api_server/$endpoint.php;
        fastcgi_param SCRIPT_NAME /api_server/$endpoint.php;
        fastcgi_pass kyber_php;
    }

    # Enlace de main.js: /demo -> demo.html
    location = /demo {
        rewrite ^ /demo.html last;
    }

    location / {
        root /var/www/html/dist;
        try_files $uri $uri/ /index.html;
    }
}
