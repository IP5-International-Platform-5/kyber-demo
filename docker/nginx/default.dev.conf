upstream kyber_php {
    server php:9000;
}

upstream kyber_vite {
    server dev:5173;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 2m;

    # API → PHP-FPM (unchanged)
    location ~ ^/app/(?<endpoint>[^/]+)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/app/$endpoint.php;
        fastcgi_param SCRIPT_NAME /app/$endpoint.php;
        fastcgi_pass kyber_php;
    }

    location ~ ^/api_server/(?<endpoint>[^/]+)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api_server/$endpoint.php;
        fastcgi_param SCRIPT_NAME /api_server/$endpoint.php;
        fastcgi_pass kyber_php;
    }

    # Front → Vite dev server (live src/, index.html, demo.html; F5 picks up edits)
    location / {
        proxy_pass http://kyber_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
