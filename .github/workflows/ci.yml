name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sintaxis:
    name: Sintaxis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      # Sin submódulos: liboqs-php es código de terceros y no se analiza.
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl
          coverage: none

      - name: Comprobar sintaxis
        run: |
          find api_server app libs public -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  calidad-php:
    name: Estilo y análisis estático (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl
          coverage: none

      - name: Instalar dependencias
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-progress

      # TODO: el código de este repositorio viene de una base escrita con
      # tabuladores, así que la primera pasada de PHP-CS-Fixer toca ~690 líneas
      # en 11 ficheros. Hasta que se haga esa pasada en un PR propio de tipo
      # `style:`, este paso informa pero no bloquea. QUITAR el
      # `continue-on-error` en cuanto el repositorio esté formateado.
      - name: Estilo (PHP-CS-Fixer)
        continue-on-error: true
        run: vendor/bin/php-cs-fixer check --diff --show-progress=none

      - name: Análisis estático (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  calidad-front:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # TODO: mismo caso que PHP-CS-Fixer. Quitar el continue-on-error tras la
      # primera pasada de `npm run formato:aplicar`.
      - name: Formato (Prettier)
        continue-on-error: true
        run: npm run formato

      - name: Compilar
        run: npm run build

  titulo-del-pr:
    name: Título del PR (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Con squash merge el título del PR acaba siendo el mensaje del commit
      # en main, así que se valida aquí. Ver CONTRIBUTING.md.
      - name: Validar formato
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          patron='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{1,}$'
          if ! printf '%s' "$TITULO" | grep -Eq "$patron"; then
            echo "::error::El título del PR no sigue Conventional Commits: '$TITULO'"
            echo "Formato esperado: <tipo>(ámbito opcional): descripción en minúscula"
            echo "Ejemplo:          feat(demo): muestra el ciphertext en hexadecimal"
            echo "Tipos válidos:    feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
          echo "Título correcto: $TITULO"
