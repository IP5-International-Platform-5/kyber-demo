# Merged only for `npm run docker:dev`: Nginx on 8080 proxies the front to Vite; PHP without OPcache.
services:
  web:
    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
  php:
    volumes:
      - ./docker/php/opcache-dev.ini:/usr/local/etc/php/conf.d/zzz-opcache-dev.ini:ro
